<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Acesso</title>

  <style>
    /* ===== Estilo geral: tudo que for adicionado usa estas variáveis ===== */
    :root {
      color-scheme: light;
      --cor-fundo: #f6f8fc;
      --cor-superficie: #ffffff;
      --cor-texto: #2a3550;
      --cor-texto-suave: #7a859c;
      --cor-borda: #e3e8f1;
      --cor-destaque: #5b8def;
      --cor-destaque-escura: #4a79d8;
      --cor-destaque-clara: #eaf1ff;
      --cor-erro: #d64545;
      --raio: 12px;
      --espaco: 16px;
      --sombra: 0 10px 30px rgba(60, 90, 150, 0.1);
      --fonte: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }

    html, body {
      min-height: 100%;
      background: var(--cor-fundo);
    }

    body {
      font-family: var(--fonte);
      font-size: 16px;
      color: var(--cor-texto);
      min-height: 100vh;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    :focus-visible {
      outline: 3px solid rgba(91, 141, 239, 0.45);
      outline-offset: 2px;
    }

    /* ===== Tela de cadastro / login ===== */
    .tela-acesso {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--espaco);
    }

    .cartao {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio);
      box-shadow: var(--sombra);
    }

    .titulo {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 600;
    }

    .abas {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 24px;
      background: var(--cor-fundo);
      border-radius: 10px;
    }

    .aba {
      flex: 1;
      padding: 8px;
      color: var(--cor-texto-suave);
      background: none;
      border: 0;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .aba.ativa {
      color: var(--cor-destaque-escura);
      font-weight: 600;
      background: var(--cor-superficie);
      box-shadow: 0 1px 3px rgba(60, 90, 150, 0.15);
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: var(--espaco);
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .campo input {
      padding: 11px 12px;
      font-weight: 400;
      color: var(--cor-texto);
      background: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .campo input:focus {
      outline: none;
      border-color: var(--cor-destaque);
      box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.2);
    }

    .erro {
      min-height: 18px;
      font-size: 14px;
      color: var(--cor-erro);
    }

    .btn {
      padding: 12px;
      font-weight: 600;
      color: #ffffff;
      background: var(--cor-destaque);
      border: 0;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--cor-destaque-escura); }

    /* ===== Tela principal com barra lateral ===== */
    .app {
      display: flex;
      min-height: 100vh;
    }

    .lateral {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      width: 68px;
      padding: 12px;
      overflow: hidden;
      background: var(--cor-superficie);
      border-right: 1px solid var(--cor-borda);
      transition: width 0.25s ease, box-shadow 0.25s ease;
    }

    .lateral.aberta {
      width: 250px;
      box-shadow: var(--sombra);
    }

    .conteudo {
      flex: 1;
      min-height: 100vh;
      margin-left: 68px;
      background: var(--cor-fundo);
    }

    /* Botão dos 3 tracinhos */
    .btn-menu {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 44px;
      height: 44px;
      padding: 0 11px;
      background: none;
      border: 0;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .btn-menu:hover { background: var(--cor-destaque-clara); }

    .btn-menu span {
      display: block;
      width: 100%;
      height: 3px;
      background: var(--cor-texto);
      border-radius: 2px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .lateral.aberta .btn-menu span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .lateral.aberta .btn-menu span:nth-child(2) { opacity: 0; }
    .lateral.aberta .btn-menu span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* Itens do menu lateral */
    .lateral-menu {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 226px;
      margin-top: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .lateral.aberta .lateral-menu {
      opacity: 1;
      pointer-events: auto;
    }

    .usuario {
      padding: 8px 12px 16px;
      margin-bottom: 8px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid var(--cor-borda);
    }

    .menu-item {
      padding: 10px 12px;
      text-align: left;
      color: var(--cor-texto);
      background: none;
      border: 0;
      border-radius: 8px;
    }

    .menu-item:hover,
    .menu-item.ativo {
      background: var(--cor-destaque-clara);
      color: var(--cor-destaque-escura);
    }

    .menu-item.ativo { font-weight: 600; }

    .menu-separador {
      height: 1px;
      margin: 8px 0;
      background: var(--cor-borda);
    }
  </style>
</head>
<body>

  <!-- Valor 8: Fazer cadastro ou login -->
  <section class="tela-acesso" id="telaAcesso">
    <div class="cartao">
      <h1 class="titulo" id="titulo">Entrar</h1>

      <div class="abas">
        <button type="button" class="aba ativa" data-modo="login">Entrar</button>
        <button type="button" class="aba" data-modo="cadastro">Cadastrar</button>
      </div>

      <form class="form" id="form" novalidate>
        <label class="campo" id="campoNome" hidden>
          Nome
          <input type="text" id="nome" autocomplete="name">
        </label>

        <label class="campo">
          E-mail
          <input type="email" id="email" autocomplete="email">
        </label>

        <label class="campo">
          Senha
          <input type="password" id="senha" autocomplete="current-password">
        </label>

        <p class="erro" id="erro" role="alert"></p>

        <button type="submit" class="btn" id="btnEnviar">Entrar</button>
      </form>
    </div>
  </section>

  <!-- Valor 8: Abrir menu nos 3 tracinhos -->
  <div class="app" id="app" hidden>
    <aside class="lateral" id="lateral">
      <button type="button" class="btn-menu" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="lateral-menu">
        <p class="usuario" id="usuario"></p>
        <button type="button" class="menu-item">Opção 1</button>
        <button type="button" class="menu-item">Opção 2</button>
        <button type="button" class="menu-item">Opção 3</button>
        <button type="button" class="menu-item">Opção 4</button>
        <div class="menu-separador"></div>
        <button type="button" class="menu-item" id="btnSair">Sair</button>
      </nav>
    </aside>

    <main class="conteudo" id="conteudo"></main>
  </div>

  <script>
    const CHAVE_USUARIOS = 'usuarios';
    const CHAVE_SESSAO = 'sessao';

    const telaAcesso = document.getElementById('telaAcesso');
    const app = document.getElementById('app');
    const titulo = document.getElementById('titulo');
    const abas = document.querySelectorAll('.aba');
    const form = document.getElementById('form');
    const campoNome = document.getElementById('campoNome');
    const inputNome = document.getElementById('nome');
    const inputEmail = document.getElementById('email');
    const inputSenha = document.getElementById('senha');
    const erro = document.getElementById('erro');
    const btnEnviar = document.getElementById('btnEnviar');
    const lateral = document.getElementById('lateral');
    const btnMenu = document.getElementById('btnMenu');
    const btnSair = document.getElementById('btnSair');
    const usuario = document.getElementById('usuario');
    const conteudo = document.getElementById('conteudo');
    const itensMenu = document.querySelectorAll('.menu-item:not(#btnSair)');

    let modo = 'login';

    /* ---------- Armazenamento (navegador; usa memória se o navegador bloquear) ---------- */
    const memoria = {};
    const guardar = {
      ler(chave) {
        try {
          const valor = localStorage.getItem(chave);
          if (valor !== null) return JSON.parse(valor);
        } catch (e) {}
        return memoria[chave] !== undefined ? JSON.parse(memoria[chave]) : null;
      },
      salvar(chave, valor) {
        const texto = JSON.stringify(valor);
        memoria[chave] = texto;
        try { localStorage.setItem(chave, texto); } catch (e) {}
      },
      apagar(chave) {
        delete memoria[chave];
        try { localStorage.removeItem(chave); } catch (e) {}
      }
    };

    /* ---------- Login / Cadastro ---------- */
    function mudarModo(novoModo) {
      modo = novoModo;
      const cadastro = modo === 'cadastro';
      campoNome.hidden = !cadastro;
      titulo.textContent = cadastro ? 'Criar conta' : 'Entrar';
      btnEnviar.textContent = cadastro ? 'Cadastrar' : 'Entrar';
      inputSenha.autocomplete = cadastro ? 'new-password' : 'current-password';
      erro.textContent = '';
      abas.forEach(aba => aba.classList.toggle('ativa', aba.dataset.modo === modo));
    }

    abas.forEach(aba => aba.addEventListener('click', () => mudarModo(aba.dataset.modo)));

    form.addEventListener('submit', e => {
      e.preventDefault();
      erro.textContent = '';

      const nome = inputNome.value.trim();
      const email = inputEmail.value.trim().toLowerCase();
      const senha = inputSenha.value;
      const usuarios = guardar.ler(CHAVE_USUARIOS) || [];

      if (!email || !email.includes('@') || !email.includes('.')) {
        erro.textContent = 'Digite um e-mail válido.';
        return;
      }

      if (modo === 'cadastro') {
        if (!nome) {
          erro.textContent = 'Digite seu nome.';
          return;
        }
        if (senha.length < 6) {
          erro.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
          return;
        }
        if (usuarios.some(u => u.email === email)) {
          erro.textContent = 'Este e-mail já está cadastrado.';
          return;
        }
        usuarios.push({ nome, email, senha });
        guardar.salvar(CHAVE_USUARIOS, usuarios);
        entrar({ nome, email });
      } else {
        const encontrado = usuarios.find(u => u.email === email && u.senha === senha);
        if (!encontrado) {
          erro.textContent = 'E-mail ou senha incorretos.';
          return;
        }
        entrar({ nome: encontrado.nome, email: encontrado.email });
      }
    });

    /* ---------- Troca de tela ---------- */
    function entrar(dados) {
      guardar.salvar(CHAVE_SESSAO, dados);
      usuario.textContent = dados.nome;
      telaAcesso.hidden = true;
      app.hidden = false;
      fecharMenu();
    }

    function sair() {
      guardar.apagar(CHAVE_SESSAO);
      form.reset();
      mudarModo('login');
      app.hidden = true;
      telaAcesso.hidden = false;
    }

    btnSair.addEventListener('click', sair);

    /* ---------- Menu lateral (3 tracinhos) ---------- */
    function abrirMenu() {
      lateral.classList.add('aberta');
      btnMenu.setAttribute('aria-expanded', 'true');
      btnMenu.setAttribute('aria-label', 'Fechar menu');
    }

    function fecharMenu() {
      lateral.classList.remove('aberta');
      btnMenu.setAttribute('aria-expanded', 'false');
      btnMenu.setAttribute('aria-label', 'Abrir menu');
    }

    btnMenu.addEventListener('click', () => {
      if (lateral.classList.contains('aberta')) fecharMenu();
      else abrirMenu();
    });

    itensMenu.forEach(item => {
      item.addEventListener('click', () => {
        itensMenu.forEach(i => i.classList.remove('ativo'));
        item.classList.add('ativo');
      });
    });

    conteudo.addEventListener('click', fecharMenu);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') fecharMenu();
    });

    /* ---------- Ao abrir a página ---------- */
    const sessao = guardar.ler(CHAVE_SESSAO);
    if (sessao) entrar(sessao);
  </script>
</body>
</html>
